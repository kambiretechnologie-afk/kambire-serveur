<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue — KAMBIRE INFORMATIQUE</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Accueil</a> / <span>Catalogue</span></div>
    <h1 id="pageTitle">Notre catalogue</h1>
  </div>
</section>

<section class="section" style="padding-top:34px">
  <div class="container">
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass si"></i>
      <input type="text" id="search" placeholder="Rechercher un ordinateur, une marque, un accessoire...">
    </div>
    <div class="catalog-top">
      <button class="btn btn-ghost btn-sm filters-mobile-btn" onclick="document.querySelector('.filters').classList.toggle('open')"><i class="fa-solid fa-sliders"></i> Filtres</button>
      <span class="count" id="resCount"></span>
      <select id="sort">
        <option value="pop">Trier par : Popularité</option>
        <option value="price-asc">Prix croissant</option>
        <option value="price-desc">Prix décroissant</option>
        <option value="new">Nouveautés</option>
      </select>
    </div>
    <div class="catalog">
      <aside class="filters">
        <div class="fgroup">
          <h4>Marque</h4>
          <div id="fBrand" class="option-grid"></div>
        </div>
        <div class="fgroup">
          <h4>Prix maximum</h4>
          <div class="range-val" id="priceVal">1 500 000 FCFA</div>
          <input type="range" id="priceRange" min="20000" max="1500000" step="5000" value="1500000">
        </div>
        <div class="fgroup">
          <h4>Génération</h4>
          <div id="fGen" class="option-grid"></div>
        </div>
        <div class="fgroup">
          <h4>Processeur</h4>
          <div class="option-grid two-cols">
            <label class="chk"><input type="checkbox" class="f-cpu" value="i5"> Core i5</label>
            <label class="chk"><input type="checkbox" class="f-cpu" value="i7"> Core i7</label>
          </div>
        </div>
        <div class="fgroup">
          <h4>Mémoire RAM</h4>
          <div class="option-grid three-cols">
            <label class="chk"><input type="checkbox" class="f-ram" value="8"> 8 Go</label>
            <label class="chk"><input type="checkbox" class="f-ram" value="16"> 16 Go</label>
            <label class="chk"><input type="checkbox" class="f-ram" value="32"> 32 Go</label>
          </div>
        </div>
        <div class="fgroup">
          <h4>Stockage SSD</h4>
          <div class="option-grid three-cols">
            <label class="chk"><input type="checkbox" class="f-ssd" value="256"> 256 Go</label>
            <label class="chk"><input type="checkbox" class="f-ssd" value="512"> 512 Go</label>
            <label class="chk"><input type="checkbox" class="f-ssd" value="1024"> 1 To</label>
          </div>
        </div>
        <div class="fgroup">
          <div class="option-grid stacked">
            <label class="chk"><input type="checkbox" id="fTactile"> Écran tactile</label>
            <label class="chk"><input type="checkbox" id="fDispo"> Disponible uniquement</label>
            <label class="chk"><input type="checkbox" id="fPromo"> En promotion</label>
          </div>
        </div>
        <button class="btn btn-ghost btn-block btn-sm" onclick="resetFilters()"><i class="fa-solid fa-rotate-left"></i> Réinitialiser</button>
      </aside>
      <div>
        <div class="prod-grid" id="catGrid"></div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/catalogue.js"></script>
</body>
</html>
